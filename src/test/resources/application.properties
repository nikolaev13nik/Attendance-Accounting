spring.datasource.url=jdbc:h2:mem:attendance-accounting-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db.migration
spring.flyway.clean-disabled=false
spring.web.error.include-message=always


attendance-accounting.security.jwt.secret=test-only-secret-key-1234567890-abcdef    
attendance-accounting.security.jwt.ttl-seconds=3600
# The bootstrap super-admin has no default password by design, so tests must
# supply one or the context fails to start. Tests do not use this account -
# their fixtures are the Flyway-seeded users 1/2/3 in tenants 100/200, and this
# one lands in tenant 0, so it never appears in their tenant-filtered assertions.
attendance-accounting.bootstrap.admin.password=test-bootstrap-password
