spring.datasource.url=jdbc:h2:mem:attendance-accounting-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db.migration
spring.flyway.clean-disabled=false
spring.web.error.include-message=always


attendance-accounting.security.jwt.secret=test-only-secret-key-1234567890-abcdef    
attendance-accounting.security.jwt.ttl-seconds=3600
