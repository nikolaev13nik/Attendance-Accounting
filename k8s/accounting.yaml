# Accounting: the JWT-issuing service.
# New here vs postgres/kafka: RollingUpdate, a startupProbe, and consuming the
# ConfigMap + Secret created in Step 11.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting
  namespace: attendance
spec:
  replicas: 1

  strategy:
    type: RollingUpdate              # stateless app -> safe to run old and new together briefly
    rollingUpdate:
      maxSurge: 1                    # allow 1 EXTRA pod above replicas during a rollout
      maxUnavailable: 0              # never go below replicas -> zero-downtime deploy

  selector:
    matchLabels:
      app: accounting
  template:
    metadata:
      labels:
        app: accounting
    spec:
      containers:
        - name: accounting
          # Built and pushed by THIS repo's .github/workflows/ci.yml on every push to
          # main, which also creates the matching git tag. The cluster pulls it;
          # nothing is built on your Mac. That is how every real deployment works.
          image: ghcr.io/nikolaev13nik/attendance-accounting:1.0.3

          imagePullPolicy: IfNotPresent   # pull only if not already in the node's image store.
            # Safe because this tag is immutable in practice - a new
            # build gets a new version. Use Always only for mutable
          # tags like :latest, and prefer not to use those at all.

          ports:
            - containerPort: 8080

          env:
            - name: JAVA_TOOL_OPTIONS
              # Java 10+ is container-aware: it reads the cgroup limit, not the host's 12GB.
              # 75% of the memory LIMIT below becomes the max heap, and it rescales
              # automatically if you change that limit.
              value: "-XX:MaxRAMPercentage=75"

            # --- pulled individually from the ConfigMap ---------------------------
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: attendance-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: attendance-config
                  key: POSTGRES_PORT
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              valueFrom:
                configMapKeyRef:
                  name: attendance-config
                  key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
            - name: SPRING_JPA_DATABASE_PLATFORM
              valueFrom:
                configMapKeyRef:
                  name: attendance-config
                  key: SPRING_JPA_DATABASE_PLATFORM

            # $(VAR) expands variables defined EARLIER in this same list.
            # Verified working; if it ever fails you'd see a literal "$(POSTGRES_HOST)"
            # in the JDBC URL in the logs.
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/attendance?currentSchema=accounting"

            - name: SPRING_DATASOURCE_USERNAME
              value: accounting_user   # the restricted user - can only touch the accounting schema

            # --- from the Secret, one key at a time ------------------------------
            # Deliberately NOT `envFrom: secretRef`, which would inject ALL four keys
            # including TimeTracking's password. Least privilege.
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: ACCOUNTING_DB_PASSWORD
            - name: ATTENDANCE_ACCOUNTING_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: JWT_SECRET       # the SAME key TimeTracking reads -> tokens interoperate

          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"            # MaxRAMPercentage=75 -> ~768Mi max heap
              cpu: "1000m"

          # --- three probes, three jobs ---------------------------------------
          startupProbe: # "has it finished booting?" Spring Boot is slow here.
            httpGet: # While this runs, readiness and liveness are DISABLED.
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 36       # 36 x 5s = up to 180s to start before giving up

          readinessProbe: # "can it serve traffic?" - failing removes it from the Service
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe: # "is it broken?" - failing RESTARTS the container
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3        # 3 failures x 30s = 90s before a restart

---
apiVersion: v1
kind: Service
metadata:
  name: accounting                     # the DNS name in ATTENDANCE_ACCOUNTING_BASE_URL
  namespace: attendance
spec:
  type: ClusterIP
  selector:
    app: accounting
  ports:
    - port: 8080                       # http://accounting:8080 from inside the cluster
      targetPort: 8080
